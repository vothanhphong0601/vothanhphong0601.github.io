<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rectangles</title>
    <style>
      .Outside-div {
        border: 3px dotted blue;
        border-radius: 10px;
        padding: 15px;
      }
      .Middle-div {
        border: 3px dashed red;
        border-radius: 8px;
        padding: 15px;
      }
      .Inner-div {
        border: 2px solid green;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="Outside-div">
      <div class="Middle-div">
        <div class="Inner-div">I am heavily packed &lt;Div&gt;</div>
      </div>
    </div>
  </body>
</html>
