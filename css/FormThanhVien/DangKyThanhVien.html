<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng ký thành viên</title>
    <link rel="stylesheet" href="DangKyThanhVien.css" />
  </head>
  <body>
    <form id="form1" action="#">
      <table class="mytextbox">
        <tr>
          <td>Họ tên</td>
          <td><input type="text" id="txtHoTen" /></td>
        </tr>
        <tr>
          <td>Tên đăng nhập</td>
          <td><input type="text" id="txtUserName" /></td>
        </tr>
        <tr>
          <td>Mật khẩu</td>
          <td><input type="text" id="txtPass" /></td>
        </tr>
        <tr>
          <td>Gõ lại mật khẩu</td>
          <td><input type="text" id="Repass" /></td>
        </tr>
        <tr>
          <td>Giới tính</td>
          <td>
            <input type="radio" name="rdGioiTinh" value="0" />Nam
            <input type="radio" name="rdGioiTinh" value="1" checked />Nữ
          </td>
        </tr>
        <tr>
          <td>Ngoại ngữ</td>
          <td>
            <input type="checkbox" id="chkAnh" />
            <label for="chkAnh">Anh văn</label>
            <input type="checkbox" id="chkPhap" />
            <label fo="chkPhap">Pháp văn</label>
            <input type="checkbox" id="chkHoa" />
            <label for="chkHoa">Hoa văn</label>
          </td>
        </tr>
        <tr>
          <td>Nghề nghiệp</td>
          <td>
            <select name="cboNgheNghiep" id="cboNgheNghiep">
              <option for="cboNgheNghiep" value="0">Bạn làm nghề gì?</option>
              <option for="cboNgheNghiep" value="1">
                Học sinh - Sinh viên
              </option>
              <option for="cboNgheNghiep" value="2">Giáo viên</option>
              <option for="cboNgheNghiep" value="3">Nhân viên</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Hình</td>
          <td><input type="file" id="fHinh" /></td>
        </tr>
        <tr>
          <td>Sở thích</td>
          <td>
            <textarea name="" id="txtSoSoThich"></textarea>
          </td>
        </tr>
        <tr>
          <td>
            <input type="submit" id="btnDangKy" value="Đăng ký" />
            <input type="reset" id="btnXoa" value="Làm lại" />
            <input type="hidden" name="NgayDangKy" value="03/23/2023" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
